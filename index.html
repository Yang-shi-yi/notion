<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Dynamic Minimal Progress</title>
<style>
  /* 全局设置，确保完全透明并占满 Notion 的 Embed 窗口 */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: rgb(55, 65, 81); /* 采用源码中的精确 RGB 颜色 */
    display: flex;
    flex-direction: column;
    /* 均匀分布每一行，填满整个高度 */
    justify-content: space-evenly; 
    padding: 4px 8px; /* 预留极小边距防截断 */
    box-sizing: border-box;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  /* 进度条外框：吸收源码逻辑，高度自适应 */
  .bar-container {
    flex-grow: 1; /* 核心优化：自动占满左侧所有剩余空间 */
    height: 22vh; /* 吸收源码：高度随 Embed 窗口高度变化 */
    max-height: 20px; /* 设置上限，防止拉得过高变得难看 */
    min-height: 8px;  /* 设置下限 */
    border: 2px solid rgb(55, 65, 81);
    border-radius: 999px; /* 完美的胶囊圆角 */
    overflow: hidden;
    background: transparent;
    display: flex;
  }

  /* 进度条填充 */
  .bar-fill {
    height: 100%;
    background-color: rgb(55, 65, 81);
    width: 0%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); /* 让进度条加载时有丝滑的动画 */
  }

  /* 百分比文本 */
  .percentage {
    font-size: 14px;
    font-weight: 500;
    /* 固定最小宽度，防止从 9% 变到 10% 时整个布局抖动 */
    min-width: 32px; 
    text-align: right;
  }
</style>
</head>
<body>

<div class="row">
  <div class="bar-container"><div class="bar-fill" id="year-bar"></div></div>
  <div class="percentage" id="year-percent"></div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="month-bar"></div></div>
  <div class="percentage" id="month-percent"></div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="week-bar"></div></div>
  <div class="percentage" id="week-percent"></div>
</div>

<script>
  function updateProgress() {
    const now = new Date();

    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
    const yearPercent = ((now - startOfYear) / (endOfYear - startOfYear)) * 100;

    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const monthPercent = ((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100;

    const dayOfWeek = now.getDay() || 7; 
    const startOfWeek = new Date(now);
    startOfWeek.setHours(0,0,0,0);
    startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 7);
    const weekPercent = ((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100;

    function setBar(id, percent) {
      const p = Math.floor(percent);
      document.getElementById(id + '-bar').style.width = p + '%';
      document.getElementById(id + '-percent').innerText = p + '%';
    }

    // 延迟一点点执行，配合 CSS 实现页面加载时的丝滑填充动画
    setTimeout(() => {
      setBar('year', yearPercent);
      setBar('month', monthPercent);
      setBar('week', weekPercent);
    }, 100);
  }

  updateProgress();
  setInterval(updateProgress, 60000); 
</script>
</body>
</html>
