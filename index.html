<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Progress Bar - Aligned</title>
<style>
  /* 全局透明与基础排版 */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: rgb(55, 65, 81);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly; 
    padding: 4px 8px; 
    box-sizing: border-box;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  /* 方形外边框 */
  .bar-container {
    flex-grow: 1; 
    height: 22vh; 
    max-height: 20px;
    min-height: 14px;
    border: 2px solid rgb(55, 65, 81);
    border-radius: 4px; /* 微圆角方形 */
    padding: 2px; /* 电池风留白 */
    box-sizing: border-box;
    display: flex;
  }

  /* 方形内部进度条 */
  .bar-fill {
    height: 100%;
    background-color: rgb(55, 65, 81);
    border-radius: 2px; 
    width: 0%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
  }

  /* 【排版核心】文本标签的左右对齐设计 */
  .percentage {
    font-size: 15px; 
    font-weight: 400; 
    /* 1. 设定一个固定的宽度，确保三行文字占据的区域一样大 */
    width: 90px; 
    /* 2. 开启弹性盒子 */
    display: flex; 
    /* 3. 神奇属性：让两端的元素分别贴紧左右两侧 */
    justify-content: space-between; 
    /* 防止在小屏幕下被进度条挤压变形 */
    flex-shrink: 0; 
  }
</style>
</head>
<body>

<div class="row">
  <div class="bar-container"><div class="bar-fill" id="year-bar"></div></div>
  <div class="percentage" id="year-text"></div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="month-bar"></div></div>
  <div class="percentage" id="month-text"></div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="week-bar"></div></div>
  <div class="percentage" id="week-text"></div>
</div>

<script>
  function updateProgress() {
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();
    const currentDate = now.getDate();

    // 1. 年份计算 (底层毫秒级时间戳，完全无视闰年平年差异，精准无误)
    const startOfYear = new Date(currentYear, 0, 1).getTime();
    const endOfYear = new Date(currentYear + 1, 0, 1).getTime();

    // 2. 月份计算 (JS 引擎自动处理 28/30/31 天)
    const startOfMonth = new Date(currentYear, currentMonth, 1).getTime();
    const endOfMonth = new Date(currentYear, currentMonth + 1, 1).getTime();

    // 3. 星期计算 (国际标准周一为起点)
    // now.getDay() 返回 0(周日)-6(周六)。我们将周日(0)强制转为 7，方便做数学减法
    const dayOfWeek = now.getDay() === 0 ? 7 : now.getDay(); 
    const startOfWeek = new Date(currentYear, currentMonth, currentDate - dayOfWeek + 1).getTime();
    const endOfWeek = new Date(currentYear, currentMonth, currentDate - dayOfWeek + 8).getTime();

    const currentTime = now.getTime();

    // 计算百分比并向下取整
    const yearPercent = Math.floor(((currentTime - startOfYear) / (endOfYear - startOfYear)) * 100);
    const monthPercent = Math.floor(((currentTime - startOfMonth) / (endOfMonth - startOfMonth)) * 100);
    const weekPercent = Math.floor(((currentTime - startOfWeek) / (endOfWeek - startOfWeek)) * 100);

    // 渲染更新界面
    function setBar(id, percent, label) {
      // 更新进度条宽度
      document.getElementById(id + '-bar').style.width = percent + '%';
      
      // 【排版核心】将 Label 和 Percentage 分别装进两个 span 中
      // 配合 CSS 的 space-between，实现绝对的左右两端对齐
      document.getElementById(id + '-text').innerHTML = `<span>${label}:</span><span>${percent}%</span>`;
    }

    setTimeout(() => {
      setBar('year', yearPercent, 'Year');
      setBar('month', monthPercent, 'Month');
      setBar('week', weekPercent, 'Week');
    }, 50);
  }

  updateProgress();
  setInterval(updateProgress, 60000); 
</script>
</body>
</html>
