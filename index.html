<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Notion Progress</title>
<style>
  body {
    /* 匹配 Notion 默认字体 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #374151; /* Notion 默认深灰色 */
    margin: 0;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    /* 核心：背景透明，以便完美融入 Notion 的浅蓝色 Callout */
    background: transparent; 
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar-container {
    width: 200px;
    height: 18px;
    border: 2px solid #374151; /* 外部的深灰色描边 */
    border-radius: 12px; /* 圆角呈现胶囊状 */
    overflow: hidden;
    background: transparent;
  }
  .bar-fill {
    height: 100%;
    background-color: #374151; /* 内部填充颜色 */
    border-radius: 6px;
    width: 0%;
    transition: width 0.5s ease;
  }
  .label {
    font-size: 15px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="row">
  <div class="bar-container"><div class="bar-fill" id="year-bar"></div></div>
  <div class="label" id="year-text">Year: 0%</div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="month-bar"></div></div>
  <div class="label" id="month-text">Month: 0%</div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="week-bar"></div></div>
  <div class="label" id="week-text">Week: 0%</div>
</div>

<script>
  function updateProgress() {
    const now = new Date();

    // 1. 计算年的进度
    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
    const yearPercent = ((now - startOfYear) / (endOfYear - startOfYear)) * 100;

    // 2. 计算月的进度
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const monthPercent = ((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100;

    // 3. 计算周的进度 (这里采用周一为一周的开始)
    const dayOfWeek = now.getDay() || 7; 
    const startOfWeek = new Date(now);
    startOfWeek.setHours(0,0,0,0);
    startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 7);
    const weekPercent = ((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100;

    // 渲染到页面
    function setBar(id, percent) {
      const p = Math.floor(percent);
      document.getElementById(id + '-bar').style.width = p + '%';
      document.getElementById(id + '-text').innerText = id.charAt(0).toUpperCase() + id.slice(1) + ': ' + p + '%';
    }

    setBar('year', yearPercent);
    setBar('month', monthPercent);
    setBar('week', weekPercent);
  }

  updateProgress();
  setInterval(updateProgress, 60000); // 每分钟刷新一次
</script>
</body>
</html>
