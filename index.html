<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Minimal Progress</title>
<style>
  /* 基础：Notion 极简风字体与深灰色 (#374151) */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #374151;
    margin: 0;
    /* 通过 padding 确保在透明 Callout 中有微小边距 */
    padding: 6px; 
    display: flex;
    flex-direction: column;
    /* gap 决定行间距，可根据需要细微调整 */
    gap: 8px;
    background: transparent;
  }
  .row {
    display: flex;
    align-items: center;
    /* 进度条与数字之间的间距 */
    gap: 8px;
  }
  /* 进度条主体设置 (维持描边空心感) */
  .bar-container {
    /* 进度条宽度，可在此调整 */
    width: 120px;
    /* 进度条高度，值越小越紧凑 */
    height: 14px;
    border: 2px solid #374151;
    /* 圆角形成胶囊状 */
    border-radius: 7px;
    overflow: hidden;
    background: transparent;
  }
  /* 内部填充：同样的深灰色 */
  .bar-fill {
    height: 100%;
    background-color: #374151;
    width: 0%;
    transition: width 0.3s ease;
  }
  /* 数值标签：优化后，仅包含百分比数值 */
  .percentage {
    /* 字体大小，适当减小以配合紧凑布局 */
    font-size: 13px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="row">
  <div class="bar-container"><div class="bar-fill" id="year-bar"></div></div>
  <div class="percentage" id="year-percent"></div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="month-bar"></div></div>
  <div class="percentage" id="month-percent"></div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="week-bar"></div></div>
  <div class="percentage" id="week-percent"></div>
</div>

<script>
  function updateProgress() {
    const now = new Date();

    // 1. 计算年的进度
    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
    const yearPercent = ((now - startOfYear) / (endOfYear - startOfYear)) * 100;

    // 2. 计算月的进度
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const monthPercent = ((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100;

    // 3. 计算周的进度 (这里采用周一为一周的开始)
    const dayOfWeek = now.getDay() || 7; 
    const startOfWeek = new Date(now);
    startOfWeek.setHours(0,0,0,0);
    startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 7);
    const weekPercent = ((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100;

    // 关键优化逻辑 (JavaScript 知识点)
    function setBar(id, percent) {
      const p = Math.floor(percent);
      // 1. 修改宽度
      document.getElementById(id + '-bar').style.width = p + '%';
      // 2. 优化关键：将 innerText 修改为仅显示百分比数值
      // 旧代码是：[ID]: [百分比]%
      // 新代码是：[百分比]%
      document.getElementById(id + '-percent').innerText = p + '%';
    }

    setBar('year', yearPercent);
    setBar('month', monthPercent);
    setBar('week', weekPercent);
  }

  updateProgress();
  // 每一分钟重新计算一次
  setInterval(updateProgress, 60000); 
</script>
</body>
</html>
