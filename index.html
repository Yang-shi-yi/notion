<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Square Progress Bar</title>
<style>
  /* 全局透明与基础排版 */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: rgb(55, 65, 81);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly; 
    padding: 4px 8px; 
    box-sizing: border-box;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  /* 【样式修改核心】外边框设计：方形 */
  .bar-container {
    flex-grow: 1; 
    height: 22vh; 
    max-height: 20px;
    min-height: 14px;
    border: 2px solid rgb(55, 65, 81);
    /* 将 999px 改为 4px，呈现 Notion 经典的微圆角方形 */
    /* 如果你想要那种绝对锋利、刀切一样的直角，请把这里改成 0px */
    border-radius: 4px; 
    padding: 2px; /* 依然保留内间距，形成嵌套感 */
    box-sizing: border-box;
    display: flex;
  }

  /* 【样式修改核心】内部进度条设计：方形 */
  .bar-fill {
    height: 100%;
    background-color: rgb(55, 65, 81);
    /* 内部填充色块的圆角要比外框稍微小一点点，视觉上最协调 */
    border-radius: 2px; 
    width: 0%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
  }

  /* 文本标签设计 */
  .percentage {
    font-size: 15px; 
    font-weight: 400; 
    white-space: nowrap; 
    min-width: 78px; 
  }
</style>
</head>
<body>

<div class="row">
  <div class="bar-container"><div class="bar-fill" id="year-bar"></div></div>
  <div class="percentage" id="year-text">Year: 0%</div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="month-bar"></div></div>
  <div class="percentage" id="month-text">Month: 0%</div>
</div>
<div class="row">
  <div class="bar-container"><div class="bar-fill" id="week-bar"></div></div>
  <div class="percentage" id="week-text">Week: 0%</div>
</div>

<script>
  function updateProgress() {
    const now = new Date();

    // 年份计算
    const startOfYear = new Date(now.getFullYear(), 0, 1);
    const endOfYear = new Date(now.getFullYear() + 1, 0, 1);
    const yearPercent = Math.floor(((now - startOfYear) / (endOfYear - startOfYear)) * 100);

    // 月份计算
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const monthPercent = Math.floor(((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100);

    // 星期计算
    const dayOfWeek = now.getDay() || 7; 
    const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1);
    const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
    const weekPercent = Math.floor(((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100);

    // 更新页面
    function setBar(id, percent, label) {
      document.getElementById(id + '-bar').style.width = percent + '%';
      document.getElementById(id + '-text').innerText = label + ': ' + percent + '%';
    }

    setTimeout(() => {
      setBar('year', yearPercent, 'Year');
      setBar('month', monthPercent, 'Month');
      setBar('week', weekPercent, 'Week');
    }, 50);
  }

  updateProgress();
  setInterval(updateProgress, 60000); 
</script>
</body>
</html>
